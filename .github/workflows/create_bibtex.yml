name: Create BiBTeX
on: [push]

jobs:
  archive-bibtex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -r python/requirements.txt ]; then pip install -r python/requirements.txt ; fi

          # Install program analysis tools
          pip install black flake8 autopep8 || true
          pip install autopep8 || true

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 python --count --select=E9,F63,F7,F82 --show-source --statistics --exit-zero

          # exit-zero treats all errors as warnings.  The GitHub editor is 127 chars wide
          # flake8 python --count --exit-zero --max-complexity=10 --statistics

      # NIST no longer keeps allrecords.xml in the branch. The file moved to
      # xml/ARCHIVE/allrecords.xml, which holds no data, and NIST publishes the
      # metadata as a release asset. Take it from the latest release.
      # The -L flag is necessary: the release URL answers 302.
      - name: Download the metadata
        run: |
          curl -sSL --fail -o allrecords.xml \
            https://github.com/usnistgov/NIST-Tech-Pubs/releases/latest/download/allrecords.xml

      - name: Create BiBTeX
        run: |
          mkdir -p downloads
          python3 python/generate_bibtex.py allrecords.xml downloads/nist_technical_pubs.bib --nosubtitle

      - name: Upload BiBTeX file as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-for-download
          path: downloads/nist_technical_pubs.bib
