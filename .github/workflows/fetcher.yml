name: Fetcher

on:
  push:
  schedule:
    - cron: '1 15 * * *'
  workflow_dispatch:
    inputs:
      release:
        description: 'NIST-Tech-Pubs release tag, for example July2026. Empty takes the latest release.'
        required: false
        default: ''

jobs:
  crawl:
    name: NIST documents fetching
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # Pass the input through the environment, not through text substitution.
      # A shell metacharacter in the value then stays inert.
      - name: Fetch documents
        env:
          RELEASE: ${{ github.event.inputs.release }}
        run: |
          bundle exec ruby crawler.rb "$RELEASE"

      - name: Compress documents
        run: |
          zip -r data.zip data

      - name: Upload documents
        uses: actions/upload-artifact@v4
        with:
          name: nist-docs
          path: data.zip
          overwrite: true
